[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commit-normalize"
version = "0.1.0"
description = "Normalize commit messages to Conventional Commits format"
requires-python = ">=3.9"

[project.scripts]
commit-normalize = "cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
